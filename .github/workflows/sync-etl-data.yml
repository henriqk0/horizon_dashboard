name: Sync ETL Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 0'

concurrency:
  group: etl-data-sync
  cancel-in-progress: false

permissions:
  contents: write

env:
  ETL_OWNER: ifesserra-lab
  ETL_REPO: horizon_etl
  ETL_BRANCH: main
  EXPORTS_DIR: data/exports

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dashboard repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve latest export zip from ETL data/exports
        id: zip
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api_url="https://api.github.com/repos/${{ env.ETL_OWNER }}/${{ env.ETL_REPO }}/contents/${{ env.EXPORTS_DIR }}?ref=${{ env.ETL_BRANCH }}"
          manifest_file="$(mktemp)"

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api_url" > "$manifest_file"

          # Preferencia de selecao:
          # 1) ultimo zip com nome com timestamp (canonical_export_YYYYMMDD_HHMMSS.zip);
          # 2) qualquer zip com "canonical" no nome;
          # 3) o ultimo zip da listagem.
          zip_name="$(jq -r '
            (( map(select(.type == "file" and (.name | test("^canonical_export_[0-9]{8}_[0-9]{6}\\.zip$")))) | sort_by(.name) | last )
              // ( map(select(.type == "file" and (.name | contains("canonical") and endswith(".zip")))) | sort_by(.name) | last )
              // ( map(select(.type == "file" and (.name | endswith(".zip")))) | sort_by(.name) | last )
            ).name
          ' "$manifest_file")"

          if [[ -z "$zip_name" || "$zip_name" == "null" ]]; then
            echo "Nenhum arquivo .zip encontrado em ${{ env.ETL_OWNER }}/${{ env.ETL_REPO }}/${{ env.EXPORTS_DIR }}." >&2
            exit 1
          fi

          download_url="$(jq -r --arg n "$zip_name" '.[] | select(.name == $n) | .download_url' "$manifest_file")"
          if [[ -z "$download_url" ]]; then
            echo "Nao foi possivel obter a URL de download de '$zip_name'." >&2
            exit 1
          fi

          curl -fSL "$download_url" -o "${RUNNER_TEMP}/etl_exports.zip"

          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"

      - name: Extract exports into src/data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/data
          unzip -o "${RUNNER_TEMP}/etl_exports.zip" -d src/data
          # Remove cruft de arquivos empacotados em macOS/Windows (nao sao dados).
          find src/data -name '.DS_Store' -delete
          find src/data -type d -name '__MACOSX' -prune -exec rm -rf {} +

      - name: Sanitize extracted JSON
        shell: bash
        run: |
          # Exports podem conter NaN/Infinity (nao-JSON); normaliza para null.
          node scripts/sanitize-json.mjs src/data

      - name: Detect data changes
        id: changed
        shell: bash
        run: |
          if git diff --quiet -- src/data ':(exclude)src/data/_meta.json'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.changed.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.changed.outputs.changed == 'true'
        run: npm ci

      - name: Validate production build
        if: steps.changed.outputs.changed == 'true'
        run: npm run build

      - name: Commit synced data
        if: steps.changed.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Carimbo de frescor do dado (UTC), lido pela home em src/pages/index.astro.
          printf '{\n  "generated_at": "%s"\n}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > src/data/_meta.json

          git add src/data
          git commit -m "chore(data): sync ETL exports"
          git push origin HEAD:main

          {
            echo "## Data sync summary"
            echo
            echo "Source zip: \`${{ env.ETL_REPO }}/${{ env.EXPORTS_DIR }}/${{ steps.zip.outputs.zip_name }}\`"
            echo
            echo "Files changed under \`src/data\`:"
            echo
            echo '```'
            git show --stat --oneline HEAD
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: No data changes
        if: steps.changed.outputs.changed != 'true'
        run: echo "Nenhuma alteracao encontrada em src/data."