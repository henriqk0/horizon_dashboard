name: Sync ETL Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

concurrency:
  group: etl-data-sync
  cancel-in-progress: false

permissions:
  contents: write

env:
  ETL_OWNER: RafaelDeps
  ETL_REPO: horizon_etl
  ETL_BRANCH: feat/009-commit-changes
  EXPORTS_DIR: data/exports

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dashboard repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      # O zip de exportacao vem do branch `mistral` do fork do ETL
      # (henriqk0/horizon_etl). Se faltar zip no diretorio apontado por
      # EXPORTS_DIR, o job termina verde com um aviso (nada a sincronizar).
      - name: Resolve export zip from ETL data/exports
        id: zip
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          manifest_file="$(mktemp)"
          zip_name=""
          found="false"

          # api_url="https://api.github.com/repos/${{ env.ETL_OWNER }}/${{ env.ETL_REPO }}/contents/${{ env.EXPORTS_DIR }}?ref=${{ env.ETL_BRANCH }}"
          api_url="https://api.github.com/repos/RafaelDeps/horizon_etl/contents/data/exports?ref=feat/009-commit-changes"

          if curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api_url" > "$manifest_file" 2>/dev/null; then

            # Preferencia de selecao:
            # 1) ultimo zip com nome com timestamp (canonical_export_YYYYMMDD_HHMMSS.zip);
            # 2) qualquer zip com "canonical" no nome;
            # 3) qualquer zip (ex.: o versionado `export.zip`).
            zip_name="$(jq -r '
              (( map(select(.type == "file" and (.name | test("^canonical_export_[0-9]{8}_[0-9]{6}\\.zip$")))) | sort_by(.name) | last )
                // ( map(select(.type == "file" and (.name | contains("canonical") and endswith(".zip")))) | sort_by(.name) | last )
                // ( map(select(.type == "file" and (.name | endswith(".zip")))) | sort_by(.name) | last )
              ).name
            ' "$manifest_file" 2>/dev/null | sed 's/^null$//')"

            if [[ -n "$zip_name" ]]; then
              download_url="$(jq -r --arg n "$zip_name" '.[] | select(.name == $n) | .download_url' "$manifest_file")"
              if [[ -n "$download_url" && "$download_url" != "null" ]]; then
                curl -fSL "$download_url" -o "${RUNNER_TEMP}/etl_exports.zip"
                found="true"
              fi
            fi
          fi

          echo "found=$found" >> "$GITHUB_OUTPUT"
          if [[ "$found" == "true" ]]; then
            echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"
            echo "Export zip resolvido: $zip_name"
          else
            echo "Nenhum .zip encontrado ainda em ${{ env.ETL_OWNER }}/${{ env.ETL_REPO }}/${{ env.EXPORTS_DIR }}. O ETL ainda nao publica o export; sync sera ignorado ate la."
          fi

      - name: Extract exports into src/data
        if: steps.zip.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/data
          unzip -o "${RUNNER_TEMP}/etl_exports.zip" -d src/data
          # Remove cruft de arquivos empacotados em macOS/Windows (nao sao dados).
          find src/data -name '.DS_Store' -delete
          find src/data -type d -name '__MACOSX' -prune -exec rm -rf {} +

      - name: Sanitize extracted JSON
        if: steps.zip.outputs.found == 'true'
        shell: bash
        run: |
          # Exports podem conter NaN/Infinity (nao-JSON); normaliza para null.
          node scripts/sanitize-json.mjs src/data

      - name: Detect data changes
        id: changed
        if: steps.zip.outputs.found == 'true'
        shell: bash
        run: |
          if git diff --quiet -- src/data ':(exclude)src/data/_meta.json'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.changed.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.changed.outputs.changed == 'true'
        run: npm ci

      - name: Validate production build
        if: steps.changed.outputs.changed == 'true'
        run: npm run build

      - name: Commit synced data
        if: steps.changed.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Carimbo de frescor do dado (UTC), lido pela home em src/pages/index.astro.
          printf '{\n  "generated_at": "%s"\n}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > src/data/_meta.json

          git add src/data
          git commit -m "chore(data): sync ETL exports"
          git push origin "HEAD:${{ github.ref_name }}"

          {
            echo "## Data sync summary"
            echo
            echo "Source zip: \`${{ env.ETL_REPO }}/${{ env.EXPORTS_DIR }}/${{ steps.zip.outputs.zip_name }}\`"
            echo
            echo "Files changed under \`src/data\`:"
            echo
            echo '```'
            git show --stat --oneline HEAD
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: No export zip published yet
        if: steps.zip.outputs.found != 'true'
        run: |
          echo "O ETL ainda nao publica \`export.zip\` (pasta \`${{ env.EXPORTS_DIR }}\` vazia/ausente no repo). Nenhuma sincronizacao realizada; o job conclui verde propositalmente."
          echo "## Data sync: nada a sincronizar" >> "$GITHUB_STEP_SUMMARY"
          echo "O ETL ainda nao publicou o zip de exportacao em \`${{ env.ETL_OWNER }}/${{ env.ETL_REPO }}/${{ env.EXPORTS_DIR }}\`. O sync sera ignorado ate existir um zip." >> "$GITHUB_STEP_SUMMARY"

      - name: No data changes
        if: steps.zip.outputs.found == 'true' && steps.changed.outputs.changed != 'true'
        run: echo "Nenhuma alteracao encontrada em src/data."
